services:
  - type: web
    name: quoter-webhook-server
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python3 webhook_handler.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: PORT
        value: 10000
    envVarsFrom:
      - key: SLACK_WEBHOOK_URL
        fromSecret: true
      - key: SLACK_ALERT_WEBHOOK_URL
        fromSecret: true
      - key: GMAIL_USER
        fromSecret: true
      - key: GMAIL_APP_PASSWORD
        fromSecret: true
      - key: PIPEDRIVE_API_TOKEN
        fromSecret: true
      - key: NOTIFICATION_EMAILS
        fromSecret: true
      - key: QUOTER_API_KEY
        fromSecret: true
      - key: QUOTER_CLIENT_SECRET
        fromSecret: true
      - key: QUOTER_REDIRECT_URI
        fromSecret: true
      - key: QBO_CLIENT_ID
        fromSecret: true
      - key: QBO_CLIENT_SECRET
        fromSecret: true
      - key: QBO_REDIRECT_URI
        fromSecret: true
      - key: QBO_REALM_ID
        fromSecret: true
      - key: QBO_COMPANY_ID
        fromSecret: true
      - key: QBO_ACCESS_TOKEN
        fromSecret: true
      - key: QBO_REFRESH_TOKEN
        fromSecret: true
      - key: QBO_SANDBOX
        fromSecret: true
      - key: QBO_INCOME_ACCOUNT_ID
        fromSecret: true
      - key: QBO_EXPENSE_ACCOUNT_ID
        fromSecret: true
      - key: SCALEPAD_API_KEY
        fromSecret: true
