services:
  - type: web
    name: quoter-webhook-server
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 webhook_handler.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: PORT
        value: 10000
    envVarsFrom:
      - key: SLACK_WEBHOOK_URL
        fromSecret: true
      - key: GMAIL_USER
        fromSecret: true
      - key: GMAIL_APP_PASSWORD
        fromSecret: true
      - key: PIPEDRIVE_API_TOKEN
        fromSecret: true
      - key: NOTIFICATION_EMAILS
        fromSecret: true
