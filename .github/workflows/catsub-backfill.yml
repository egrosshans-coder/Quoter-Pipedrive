name: CatSub Backfill

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  catsub-backfill:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run CatSub Backfill
      env:
        PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
      run: |
        python pd_catsub_backfill.py \
          --domain tlciscreative.pipedrive.com \
          --api-token $PIPEDRIVE_API_TOKEN \
          --catsub-key 9c636133839b978b686bbc952fbd5dc41d5cd087 \
          --subcategory-key ae55145d60840de457ff9e785eba68f0b39ab777 \
          --batch-size 50
